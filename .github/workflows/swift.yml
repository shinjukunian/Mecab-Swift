name: Swift

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master]

jobs:
  build:

    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
      
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
